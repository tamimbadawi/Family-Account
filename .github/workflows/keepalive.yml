name: Keep Supabase awake

# Free Supabase projects pause after ~7 days of low activity.
# This calls public.keepalive(), which writes one row, once a day.
# Skips quietly until the secrets exist (they are added in step B5).

on:
  schedule:
    - cron: '17 6 * * *'   # daily 06:17 UTC (09:17 Cairo)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call keepalive()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "Secrets not set yet — skipping (expected before step B5)."
            exit 0
          fi
          for attempt in 1 2 3; do
            code=$(curl -s -o response.txt -w '%{http_code}' -X POST \
              "$SUPABASE_URL/rest/v1/rpc/keepalive" \
              -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
              -H "Content-Type: application/json" -d '{}')
            echo "Attempt $attempt: HTTP $code — $(cat response.txt)"
            [ "$code" = "200" ] && exit 0
            sleep 30
          done
          echo "::error::Keep-alive failed. If Supabase paused the project, resume it in the dashboard."
          exit 1
