name: Keep Supabase awake

# Free Supabase projects pause after ~7 days of low activity.
# This calls public.keepalive(), which writes one row, once a day.
# Repo secrets SUPABASE_URL / SUPABASE_PUBLISHABLE_KEY override the defaults below. The defaults are
# the production project's public URL and publishable key (already shipped in the app's browser
# bundle, not secrets), so the ping works even before anyone adds the secrets.

on:
  schedule:
    - cron: '17 6 * * *'   # daily 06:17 UTC (09:17 Cairo)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call keepalive()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://zzbbniffrdigluisvxxb.supabase.co' }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_9wITIPopjTwmvl_SKtJKLA_7icGt18o' }}
        run: |
          for attempt in 1 2 3; do
            code=$(curl -s -o response.txt -w '%{http_code}' -X POST \
              "$SUPABASE_URL/rest/v1/rpc/keepalive" \
              -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
              -H "Content-Type: application/json" -d '{}')
            echo "Attempt $attempt: HTTP $code — $(cat response.txt)"
            [ "$code" = "200" ] && exit 0
            sleep 30
          done
          echo "::error::Keep-alive failed. If Supabase paused the project, resume it in the dashboard."
          exit 1
