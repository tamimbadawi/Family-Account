name: Keep scheduled workflows alive

# GitHub automatically disables scheduled workflows (cron) in repositories
# that have had no commits for 60 days.
# Pushes an empty commit on the 1st of every month to keep cron schedules active.

on:
  schedule:
    - cron: '0 0 1 * *'   # 1st of every month at midnight UTC
  workflow_dispatch:

jobs:
  stay-alive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Make empty commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keep scheduled workflows alive"
          git push
